name: Publish verified release

# Dispatch only after maintainer approval. Never build or repack here.
on:
  workflow_dispatch:
    inputs:
      candidate-run:
        description: Successful Release candidate Actions run ID
        required: true
        type: string
      candidate-commit:
        description: Exact verified 40-character source commit
        required: true
        type: string
      candidate-attempt:
        description: Successful complete four-job run attempt
        required: true
        default: "1"
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.candidate-run }}
      CANDIDATE_COMMIT: ${{ inputs.candidate-commit }}
      CANDIDATE_ATTEMPT: ${{ inputs.candidate-attempt }}
    steps:
      - name: Checkout reviewed release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org

      - name: Setup verified pnpm version
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Reserve publication paths
        run: |
          echo "RELEASE_ARTIFACTS=$RUNNER_TEMP/release-artifacts" >> "$GITHUB_ENV"
          echo "RELEASE_COMPATIBILITY=$RUNNER_TEMP/compatibility-manifest.json" >> "$GITHUB_ENV"

      - name: Require public source, protected environment and passing exact commit
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const repo = process.env.GITHUB_REPOSITORY;
          const runId = process.env.CANDIDATE_RUN;
          const commit = process.env.CANDIDATE_COMMIT;
          assert.match(runId, /^\d+$/);
          assert.match(process.env.CANDIDATE_ATTEMPT, /^[1-9]\d*$/);
          assert.match(commit, /^[a-f0-9]{40}$/);
          const api = endpoint => JSON.parse(execFileSync('gh', ['api', endpoint], {encoding:'utf8'}));
          const repository = api(`repos/${repo}`);
          assert.equal(repository.private, false, 'Public source is required for npm provenance.');
          assert.equal(process.env.GITHUB_REF, `refs/heads/${repository.default_branch}`, 'Dispatch the reviewed default branch.');
          assert.equal(process.env.GITHUB_SHA, commit, 'Publication provenance must name the candidate source.');
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim(), commit);
          const environment = api(`repos/${repo}/environments/npm-release`);
          assert(environment.protection_rules.some(rule => rule.type === 'required_reviewers' && rule.reviewers?.length), 'Configure required human reviewers before publishing.');
          const run = api(`repos/${repo}/actions/runs/${runId}`);
          assert.equal(run.path, '.github/workflows/release-candidate.yml');
          assert.equal(run.head_sha, commit);
          assert.equal(run.status, 'completed');
          assert.equal(run.conclusion, 'success');
          assert.equal(String(run.run_attempt), process.env.CANDIDATE_ATTEMPT);
          const jobs = api(`repos/${repo}/actions/runs/${runId}/jobs?per_page=100`).jobs;
          for (const os of ['ubuntu-latest', 'macos-latest']) for (const node of ['22.x', '24.x']) {
            assert(jobs.some(job => job.name === `candidate (${os}, node ${node})` && job.conclusion === 'success'), 'Missing successful matrix job.');
          }
          const ci = api(`repos/${repo}/actions/workflows/ci.yml/runs?head_sha=${commit}&per_page=100`).workflow_runs;
          const passing = ci.find(entry => entry.head_sha === commit && entry.conclusion === 'success');
          assert(passing, 'Regular CI must pass on the same source commit.');
          const ciJobs = api(`repos/${repo}/actions/runs/${passing.id}/jobs?per_page=100`).jobs;
          for (const node of ['22.x', '24.x']) assert(ciJobs.some(job => job.name === `build (node ${node})` && job.conclusion === 'success'));
          const tag = api(`repos/${repo}/git/ref/tags/v0.1.0`);
          assert.equal(tag.object.type, 'tag', 'Use a signed annotated tag.');
          const annotated = api(`repos/${repo}/git/tags/${tag.object.sha}`);
          assert.equal(annotated.object.type, 'commit');
          assert.equal(annotated.object.sha, commit);
          assert.equal(annotated.verification.verified, true, 'Signed tag verification must pass.');
          NODE

      - name: Download all original matrix artifacts
        run: gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" --pattern "untangle-candidate-*-attempt-$CANDIDATE_ATTEMPT" --dir "$RELEASE_ARTIFACTS"

      - name: Verify matrix evidence and select canonical original bundle
        run: |
          node scripts/verify-release-candidate.mjs --artifacts-dir="$RELEASE_ARTIFACTS" --commit="$CANDIDATE_COMMIT" --out="$RELEASE_COMPATIBILITY"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import path from 'node:path';
          const result = JSON.parse(readFileSync(process.env.RELEASE_COMPATIBILITY));
          assert.equal(result.actions.runId, process.env.CANDIDATE_RUN);
          assert.equal(result.actions.runAttempt, process.env.CANDIDATE_ATTEMPT);
          assert.equal(result.actions.repository, process.env.GITHUB_REPOSITORY);
          assert.equal(result.commit, process.env.CANDIDATE_COMMIT);
          appendFileSync(process.env.GITHUB_ENV, `RELEASE_BUNDLE=${path.join(process.env.RELEASE_ARTIFACTS, result.canonical.bundleDirectory)}\n`);
          NODE

      - name: Attest original tarballs
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ env.RELEASE_BUNDLE }}/tarballs/*.tgz

      - name: Attest installed production dependency SBOM
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-path: ${{ env.RELEASE_BUNDLE }}/tarballs/*.tgz
          sbom-path: ${{ env.RELEASE_BUNDLE }}/sbom.cdx.json

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11

      - name: Publish verified original files in dependency order
        # Optional short-lived bootstrap credential must be configured by the
        # approving maintainer. Subsequent publishing uses registered OIDC.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const root = process.env.RELEASE_BUNDLE;
          const report = JSON.parse(readFileSync(path.join(root, 'release-report.json')));
          const order = JSON.parse(readFileSync(path.join(root, 'publish-order.json')));
          assert.equal(order.length, 20);
          const verified = new Map(report.packages.map(item => [item.name, item]));
          // Check every immutable file and registry version before any mutation.
          for (const entry of order) {
            assert.equal(entry.version, '0.1.0');
            assert.match(entry.file, /^tarballs\/[^/]+\.tgz$/);
            const actual = createHash('sha256').update(readFileSync(path.join(root, entry.file))).digest('hex');
            assert.equal(actual, verified.get(entry.name)?.sha256);
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(entry.name)}`, {signal: AbortSignal.timeout(30000)});
            if (response.status !== 404) {
              assert.equal(response.status, 200);
              assert(!(await response.json()).versions?.[entry.version], 'Version already exists; inspect partial publication before retrying.');
            }
          }
          for (const entry of order) execFileSync('npm', ['publish', path.join(root, entry.file), '--ignore-scripts', '--access=public', '--tag=next', '--provenance', '--registry=https://registry.npmjs.org'], {stdio:'inherit', timeout:120000});
          NODE

      - name: Verify actual public registry installation
        run: node scripts/public-registry-smoke.mjs --bundle="$RELEASE_BUNDLE" --out="$RUNNER_TEMP/public-registry-report.json"

      - name: Preserve publication inputs and compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-release-inputs
          path: |
            ${{ env.RELEASE_ARTIFACTS }}/
            ${{ env.RELEASE_COMPATIBILITY }}
            ${{ runner.temp }}/public-registry-report.json
          if-no-files-found: warn
          retention-days: 30
