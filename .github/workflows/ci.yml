name: CI

on:
  push:
    branches: [main, "release-candidate/**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.x", "24.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The MCP stdio contract exercises the shipped dist/index.js, not a
      # source-only surrogate. Building here makes a fresh checkout test the
      # exact binary and prevents stale local dist output from going green.
      - name: Build shipped artifacts
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check third-party licenses
        run: pnpm run check-licenses

      - name: Check distributable package tarballs
        run: pnpm run check-publishable

      - name: Install release tarballs as isolated npm and pnpm consumers
        run: pnpm run e2e:release

      - name: Verify adapters, feature workflows and checkout activation
        run: pnpm run e2e:smoke

      - name: Unit tests
        run: pnpm run test:unit

      - name: Per-package test scripts
        run: pnpm --workspace-concurrency=1 -r --if-present run test

  # Non-blocking: exercises real Qdrant, unlike the mocked unit suite above.
  # Failures here MUST NOT fail the required "build" check (spec.md §27.1,
  # docs/BUILD_PLAN.md R3 — Ollama/live suites stay opt-in, never a CI gate).
  integration:
    name: integration (qdrant, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.1
        ports:
          - 6333:6333
          - 6334:6334
        options: >-
          --health-cmd "bash -c 'echo -n > /dev/tcp/127.0.0.1/6333'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s
    env:
      UNTANGLE_QDRANT_INTEGRATION_URL: http://127.0.0.1:6333
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build integration dependencies
        run: pnpm run build

      - name: Integration tests against live Qdrant
        run: pnpm exec vitest run packages/storage-qdrant/src/qdrant.integration.test.ts
